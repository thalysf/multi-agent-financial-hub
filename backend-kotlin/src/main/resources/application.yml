server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: financial-hub-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financial_hub}
    username: ${SPRING_DATASOURCE_USERNAME:financial_user}
    password: ${SPRING_DATASOURCE_PASSWORD:financial_pass}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  ai:
    model:
      chat: openai
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${GROQ_MODEL:meta-llama/llama-4-scout-17b-16e-instruct}
          temperature: 0.2
          max-tokens: 500

management:
  endpoints:
    web:
      exposure:
        include: health

agents:
  base-url: ${AGENTS_BASE_URL:http://localhost:8000}
