services:
  postgres:
    image: postgres:16
    container_name: financial-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_hub
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    container_name: financial-hub-backend
    working_dir: /workspace/backend-kotlin
    command: sh -lc "chmod +x mvnw && ./mvnw clean spring-boot:run"
    env_file:
      - ./agents-python/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/financial_hub
      SPRING_DATASOURCE_USERNAME: financial_user
      SPRING_DATASOURCE_PASSWORD: financial_pass
      AGENTS_BASE_URL: http://agents:8000
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
      - ./docker/maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
      agents:
        condition: service_started

  agents:
    image: python:3.14-slim
    container_name: financial-hub-agents
    working_dir: /workspace/agents-python
    command: sh -lc "python -m pip install -r requirements.txt && python -m financial_hub_agents.api"
    env_file:
      - ./agents-python/.env
    environment:
      MCP_DB_HOST: postgres
      MCP_DB_PORT: 5432
      MCP_DB_NAME: financial_hub
      MCP_DB_USER: financial_user
      MCP_DB_PASSWORD: financial_pass
      MCP_DB_SSLMODE: disable
    ports:
      - "8000:8000"
    volumes:
      - ./:/workspace
      - ./docker/pip-cache:/root/.cache/pip
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-alpine
    container_name: financial-hub-frontend
    working_dir: /workspace/frontend-react
    command: sh -lc "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./:/workspace
      - /workspace/frontend-react/node_modules
    depends_on:
      backend:
        condition: service_started
