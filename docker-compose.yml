services:
  postgres:
    image: postgres:16
    container_name: financial-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_hub
      POSTGRES_USER: financial_user
      POSTGRES_PASSWORD: financial_pass
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financial_user -d financial_hub"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: maven:3.9.11-eclipse-temurin-21
    container_name: financial-hub-backend
    working_dir: /workspace/backend-kotlin
    command: sh -lc "chmod +x mvnw && ./mvnw spring-boot:run"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/financial_hub
      SPRING_DATASOURCE_USERNAME: financial_user
      SPRING_DATASOURCE_PASSWORD: financial_pass
      SERVER_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - ./:/workspace
      - ./docker/maven-cache:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy
