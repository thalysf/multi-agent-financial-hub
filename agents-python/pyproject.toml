[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "financial-hub-agents"
version = "0.1.0"
description = "Initial multi-agent system for Financial Hub."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "groq==1.2.0",
    "mcp[cli]==1.18.0",
    "pydantic==2.12.3",
    "python-dotenv==1.2.2",
]

[project.scripts]
financial-hub-agents = "financial_hub_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
